name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的标签，例如 v1.0.5"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      commit: ${{ steps.commit.outputs.commit }}
    steps:
      - name: Resolve release tag
        id: tag
        shell: bash
        env:
          REQUESTED_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$REQUESTED_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "标签必须形如 v1.2.3" >&2
            exit 1
          fi
          echo "tag=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Pin release commit
        id: commit
        shell: bash
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  test:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32-x64
          - os: ubuntu-24.04
            platform: linux-x64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
          - os: macos-15-intel
            platform: darwin-x64
          - os: macos-15
            platform: darwin-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Validate tag matches plugin version
        shell: bash
        run: |
          node --input-type=module - <<'NODE'
          import { readFile } from "node:fs/promises";
          const manifest = JSON.parse(await readFile("qoder-subscription-proxy/.qoder-plugin/plugin.json", "utf8"));
          if (process.env.TAG !== `v${manifest.version}`) throw new Error("标签与插件版本不一致");
          if (process.env.PLATFORM !== `${process.platform}-${process.arch}`) throw new Error("runner 平台不一致");
          NODE
      - name: Prepare verified core for isolated native tests
        shell: bash
        run: node qoder-subscription-proxy/scripts/prepare-test-core.mjs
      - name: Enable real browser tests on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $candidates = @(
            "$env:ProgramFiles\Google\Chrome\Application\chrome.exe",
            "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe"
          )
          $browser = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $browser) { throw "runner 缺少可用的 Chrome/Edge" }
          "BRIDGE_TEST_BROWSER=$browser" >> $env:GITHUB_ENV
      - name: Test current platform
        shell: bash
        run: node --test --test-concurrency=1 qoder-subscription-proxy/tests/*.test.mjs

  build:
    needs: [resolve, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Package universal ZIP from tested sources
        shell: bash
        run: |
          mkdir -p dist
          node qoder-subscription-proxy/scripts/package-plugin.mjs "dist/qoder-subscription-proxy-${TAG}.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: plugin-zip
          path: dist/qoder-subscription-proxy-${{ needs.resolve.outputs.tag }}.zip
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [resolve, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.resolve.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.resolve.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Verify tag still identifies tested sources
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          node --input-type=module - <<'NODE'
          import { readFileSync } from 'node:fs';
          const manifest = JSON.parse(readFileSync('qoder-subscription-proxy/.qoder-plugin/plugin.json', 'utf8'));
          if (process.env.TAG !== `v${manifest.version}`) throw new Error('标签与插件版本不一致');
          NODE
      - uses: actions/download-artifact@v7
        with:
          name: plugin-zip
          path: dist
      - name: Verify single lightweight ZIP
        shell: bash
        run: |
          node --input-type=module - <<'NODE'
          import { readdirSync, lstatSync } from 'node:fs';
          const expected = `qoder-subscription-proxy-${process.env.TAG}.zip`;
          const files = readdirSync('dist');
          if (files.length !== 1 || files[0] !== expected) throw new Error('缺少通用 ZIP 或存在额外产物');
          const stat = lstatSync(`dist/${expected}`);
          if (!stat.isFile() || stat.size === 0 || stat.size >= 20_000_000) throw new Error(`无效产物：${expected}`);
          NODE
      - name: Create or resume a draft release
        id: draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if draft=$(gh release view "$TAG" --json isDraft --jq '.isDraft'); then
            echo "upload=$draft" >> "$GITHUB_OUTPUT"
          else
            gh release create "$TAG" --draft --verify-tag --title "$TAG" --generate-notes
            echo 'upload=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Upload draft assets with retries
        if: steps.draft.outputs.upload == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for file in dist/*.zip; do
            uploaded=false
            for attempt in 1 2 3; do
              if gh release upload "$TAG" "$file" --clobber; then
                uploaded=true
                break
              fi
              echo "上传失败：$file（第 $attempt 次），准备重试" >&2
              sleep $((attempt * 10))
            done
            if [ "$uploaded" != true ]; then
              echo "上传最终失败：$file" >&2
              exit 1
            fi
          done
      - name: Verify remote assets before publishing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" --json assets > "$RUNNER_TEMP/release-assets.json"
          node --input-type=module - "$RUNNER_TEMP/release-assets.json" <<'NODE'
          import { readdirSync, readFileSync, statSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const { assets } = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          const files = readdirSync('dist');
          if (assets.length !== files.length) throw new Error('远端 Release 资产数量不匹配');
          for (const name of files) {
            const asset = assets.find(item => item.name === name);
            if (asset?.state !== 'uploaded' || asset.size !== statSync(`dist/${name}`).size) throw new Error(`远端资产不完整：${name}`);
            if (asset.digest && asset.digest !== `sha256:${createHash('sha256').update(readFileSync(`dist/${name}`)).digest('hex')}`) throw new Error(`远端资产摘要不匹配：${name}`);
          }
          NODE
      - name: Publish verified draft
        if: steps.draft.outputs.upload == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --draft=false --verify-tag
