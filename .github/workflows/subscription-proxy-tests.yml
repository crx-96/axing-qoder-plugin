name: Subscription proxy platforms

on:
  push:
    paths:
      - "qoder-subscription-proxy/**"
      - ".qoder-plugin/marketplace.json"
      - ".gitattributes"
      - ".gitignore"
      - ".github/workflows/subscription-proxy-tests.yml"
  pull_request:
    paths:
      - "qoder-subscription-proxy/**"
      - ".qoder-plugin/marketplace.json"
      - ".gitattributes"
      - ".gitignore"
      - ".github/workflows/subscription-proxy-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      # 安装只发生在一次性 runner；通过环境选择固定工具链，不修改开发者宿主。
      - name: Prepare Rust 1.95.0
        shell: bash
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
          echo "RUSTUP_TOOLCHAIN=1.95.0" >> "$GITHUB_ENV"
      - name: Check native approval router
        shell: bash
        run: |
          cargo fmt --manifest-path qoder-subscription-proxy/native/approval-router/Cargo.toml --check
          cargo test --locked --manifest-path qoder-subscription-proxy/native/approval-router/Cargo.toml
          cargo clippy --locked --manifest-path qoder-subscription-proxy/native/approval-router/Cargo.toml -- -D warnings
      - name: Build current-platform approval router
        shell: bash
        run: node qoder-subscription-proxy/scripts/build-approval-router.mjs
      # 仅此步骤联网下载当前 runner 核心；测试默认离线，各 fixture 再复制隔离。
      - name: Prepare verified current-platform test core
        shell: bash
        run: node qoder-subscription-proxy/scripts/prepare-test-core.mjs
      - name: Test isolated proxy and MCP lifecycle
        shell: bash
        run: node --test --test-concurrency=1 qoder-subscription-proxy/tests/*.test.mjs
